substitutions:
  device_name: fermax-veo
  logger_baud_rate: "0"
  wifi_output_power: "8.5"
  wifi_priority: "0"
  wifi_priority_aux: "100"
  wifi_signal_max: "-15.0"

esphome:
  name: ${device_name}

esp32:
  board: lolin_c3_mini
  variant: esp32c3
  cpu_frequency: 80MHz

packages:
  common: !include .common.yaml

### Config ###

binary_sensor:
  - platform: analog_threshold
    name: "${device_name} Intercom"
    sensor_id: adc3
    threshold: 2.4
    filters:
      - delayed_off: 3s

button:
  - platform: output
    name: "${device_name} Open"
    output: output_open
    duration: 100ms

output:
  - platform: gpio
    pin: GPIO4
    id: output_open

sensor:
  - platform: internal_temperature
    name: "${device_name} SoC Temperature"
    update_interval: 60s

  - platform: adc
    name: "${device_name} ADC"
    id: adc3
    update_interval: 1ms
    accuracy_decimals: 2
    pin: GPIO3
    attenuation: 12db
    filters:
      - multiply: 3.2
      - delta: 0.1

status_led:
  pin:
    number: GPIO7

### Daikin Madoka ###

external_components:
  - source: github://pr#5951
    components:
      - daikin_madoka
    refresh: 1h

esp32_ble_tracker:

esp32_ble:
  io_capability: display_yes_no

ble_client:
  - mac_address: c8:d8:84:f1:f5:58
    id: madoka_climate

climate:
  - platform: daikin_madoka
    name: "Madoka Climate"
    ble_client_id: madoka_climate
    update_interval: 15s
